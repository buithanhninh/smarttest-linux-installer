# ==============================================================================
# SmartTest High-Concurrency Tuning for 2,000 Candidates
# RAM: 24GB, CPU: 12 vCPUs
# ==============================================================================

# Connection Limits
max_connections = 600

# Memory Allocation
shared_buffers = 6GB
effective_cache_size = 16GB
work_mem = 16MB
maintenance_work_mem = 1GB

# Transaction Log (WAL) & Checkpoint Tuning for Mass Submissions
wal_buffers = 64MB
checkpoint_completion_target = 0.9
max_wal_size = 8GB
min_wal_size = 1GB

# Background Writer & Query Planner (SSD Optimized)
default_statistics_target = 100
random_page_cost = 1.1
effective_io_concurrency = 200

# Connection & Transaction Safety Timeouts
idle_in_transaction_session_timeout = 60000
